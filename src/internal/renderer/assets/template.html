<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* Tables */
table { border-collapse: collapse; width: 100%; margin: 1.2em 0; }
th, td { border: 1px solid #b0a080; padding: 8px 14px; text-align: left; }
th { background: #ecdfa0; font-weight: 600; }
tr:nth-child(even) td { background: #faf5e0; }

/* Headings */
h1, h2, h3, h4, h5, h6 { font-weight: 700; line-height: 1.25; margin: 1.4em 0 0.4em; }
h1 { font-size: 2em;    border-bottom: 2px solid #c8b860; padding-bottom: 0.2em; }
h2 { font-size: 1.5em;  border-bottom: 1px solid #d4c47a; padding-bottom: 0.15em; }
h3 { font-size: 1.25em; }
h4 { font-size: 1.05em; }

/* Code */
code { font-family: Consolas, "Courier New", monospace; font-size: 0.88em; background: #ede8cc; border: 1px solid #ccc09a; border-radius: 3px; padding: 1px 5px; }
pre { background: #edead8; border: 1px solid #ccc09a; border-radius: 5px; padding: 14px 18px; overflow-x: auto; line-height: 1.5; margin: 1.2em 0; }
pre code { background: none; border: none; padding: 0; font-size: 0.85em; }

/* Blockquotes */
blockquote { border-left: 4px solid #c8b860; margin: 1.2em 0; padding: 4px 18px; color: #4a4020; background: #f7f0d0; border-radius: 0 4px 4px 0; }
blockquote p { margin: 0.4em 0; }

/* Links */
a { color: #7a5c00; text-decoration: underline; }
a:hover { color: #3d2e00; }

/* Lists */
ul, ol { padding-left: 1.8em; margin: 0.6em 0; }
li { margin: 0.25em 0; }
li input[type="checkbox"] { margin-right: 6px; }

/* Misc */
hr { border: none; border-top: 2px solid #c8b860; margin: 2em 0; }
p { margin: 0.7em 0; line-height: 1.65; }
img { max-width: 100%; height: auto; border-radius: 4px; }
del { opacity: 0.55; }

/* Help overlay */
#help-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}
#help-overlay.visible { display: flex; }
#help-box {
    background: #fdf6d8;
    border: 1px solid #b0a080;
    border-radius: 8px;
    padding: 28px 36px;
    min-width: 320px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    font-size: 16px;
}
#help-box h2 { margin: 0 0 16px; font-size: 1.1em; border: none; }
#help-box table { margin: 0; }
#help-box th, #help-box td { border: none; padding: 4px 12px 4px 0; }
#help-box td:first-child { font-family: Consolas, monospace; font-weight: 600; white-space: nowrap; }
body.dark #help-box { background: #1c1810; border-color: #4a4430; color: #e0d5b0; }

/* Dark theme */
body.dark { background: #1c1810 !important; color: #e0d5b0 !important; }
body.dark table { }
body.dark th, body.dark td { border-color: #4a4430; }
body.dark th { background: #2e2810; }
body.dark tr:nth-child(even) td { background: #231f0e; }
body.dark code { background: #2a2518; border-color: #4a4430; }
body.dark pre { background: #201d0c; border-color: #4a4430; }
body.dark blockquote { background: #242010; color: #b0a060; border-left-color: #7a6820; }
body.dark a { color: #d4a820; }
body.dark a:hover { color: #f0c840; }
body.dark h1 { border-bottom-color: #5a4e20; }
body.dark h2 { border-bottom-color: #4a4018; }
body.dark hr { border-top-color: #5a4e20; }
</style>
</head>
<body class="{{if .DarkTheme}}dark{{end}}" style="background:#fff2cf; color:#000000; font-family:sans-serif,Consolas,Arial; font-size:18px; max-width:820px; margin:0 auto; padding:40px 32px;">
<div id="help-overlay">
  <div id="help-box">
    <h2>Keyboard shortcuts</h2>
    <table>
      <tr><td>← / →</td><td>Previous / next file</td></tr>
      <tr><td>W</td><td>Toggle wide / narrow layout</td></tr>
      <tr><td>D</td><td>Toggle dark / light theme</td></tr>
      <tr><td>E</td><td>Open in editor</td></tr>
      <tr><td>F5, Ctrl+R</td><td>Reload file</td></tr>
      <tr><td>Esc</td><td>Quit</td></tr>
      <tr><td>?, H</td><td>Show / hide this menu</td></tr>
    </table>
  </div>
</div>
<div class="content">{{.Content}}</div>
<script>
window.addEventListener('load', function() {
    window.focus();
    window.scrollTo(0, {{.ScrollY}});
});
var _scrollTimer;
window.addEventListener('scroll', function() {
    clearTimeout(_scrollTimer);
    _scrollTimer = setTimeout(function() { goSaveScroll(Math.round(window.scrollY)); }, 100);
});
document.getElementById('help-overlay').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('visible');
});
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { goExit(); return; }
    if (e.key === 'F5' || (e.ctrlKey && (e.key === 'r' || e.key === 'R'))) {
        e.preventDefault();
        goReload();
    }
    if (e.key === 'w' || e.key === 'W') {
        var b = document.body;
        b.style.maxWidth = b.style.maxWidth === 'none' ? '820px' : 'none';
    }
    if (e.key === 'd' || e.key === 'D') {
        var isDark = document.body.classList.toggle('dark');
        goSaveTheme(isDark);
    }
    if (e.key === 'e' || e.key === 'E') { goOpenEditor(); return; }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); goPrev(); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); return; }
    if (e.key === '?' || e.key === 'h' || e.key === 'H') {
        document.getElementById('help-overlay').classList.toggle('visible');
    }
});
</script>
</body>
</html>
