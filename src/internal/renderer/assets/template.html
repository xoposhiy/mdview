<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background:#fff2cf; color:#000000; font-family:sans-serif,Consolas,Arial; font-size:18px; max-width:820px; margin:0 auto; padding:40px 32px;">
<div class="content">{{.Content}}</div>
<script>
window.addEventListener('load', function() { window.focus(); });
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { goExit(); return; }
    if (e.key === 'F5' || (e.ctrlKey && (e.key === 'r' || e.key === 'R'))) {
        e.preventDefault();
        goReload();
    }
});
</script>
</body>
</html>
